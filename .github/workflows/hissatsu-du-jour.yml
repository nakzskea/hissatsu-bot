name: Hissatsu du jour

on:
  schedule:
    - cron: "2 9 * * *" # 10h02 à Paris l'hiver, 11h02 l'été
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hissatsu_du_jour.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
